<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a0a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="МемоБред" />
  <meta name="description" content="Собери свой бред из мемов — вечериночная игра" />
  <title>МемоБред</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/favicon.svg" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="stylesheet" href="/style.css?v=3" />
</head>
<body>
  <div id="bg-glow" aria-hidden="true"></div>
  <div id="app"></div>

  <button id="settings-btn" class="settings-btn" aria-label="Настройки" hidden>
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none"
         stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="3"/>
      <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
    </svg>
  </button>

  <div id="settings-modal" class="modal" hidden>
    <div class="modal-backdrop"></div>
    <div class="modal-panel">
      <div class="modal-header">
        <h2>Настройки</h2>
        <button class="modal-close" aria-label="Закрыть">✕</button>
      </div>

      <div class="modal-body">
        <div class="setting-row">
          <label for="ambient-toggle">Фоновая музыка</label>
          <label class="switch">
            <input type="checkbox" id="ambient-toggle" />
            <span class="switch-slider"></span>
          </label>
        </div>

        <div class="setting-row setting-slider">
          <label for="ambient-volume">Громкость эмбиента</label>
          <input type="range" id="ambient-volume" min="0" max="100" value="15" />
          <span class="setting-value" id="ambient-volume-value">15%</span>
        </div>

        <div class="setting-row setting-track">
          <label>Трек</label>
          <div class="track-grid" id="ambient-track-grid"></div>
        </div>

        <div class="setting-row setting-slider">
          <label for="sfx-volume">Громкость мемов</label>
          <input type="range" id="sfx-volume" min="0" max="100" value="85" />
          <span class="setting-value" id="sfx-volume-value">85%</span>
        </div>

        <div class="setting-row setting-static">
          <label>Версия</label>
          <span class="setting-value" id="version-label">0.2.0</span>
        </div>
      </div>

      <div class="modal-footer">
        <button class="modal-reset" id="settings-reset">Сбросить</button>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/app.js?v=3"></script>
</body>
</html>
